[project]
name = "yomiage"
version = "0.1.0"
description = "Discord text-to-speech bot powered by VOICEVOX CORE"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "discord.py[voice]",
    "python-dotenv>=1.2.1",
    "voicevox-core @ https://github.com/VOICEVOX/voicevox_core/releases/download/0.17.1/voicevox_core-0.17.1-cp310-abi3-manylinux_2_34_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # Development/test only: lets `uv sync` and the test suite run on Windows.
    "voicevox-core @ https://github.com/VOICEVOX/voicevox_core/releases/download/0.17.1/voicevox_core-0.17.1-cp310-abi3-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.urls]
Repository = "https://github.com/sudatti624/VoiceBot.py"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=8.3.0",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",
    "D",
    "EM101",
    "EM102",
    "FBT",
    "RUF001",
    "TC",
    "TRY003",
]
fixable = ["ALL"]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"src/yomiage/commands.py" = ["C901", "PLR0915"]
"tests/**" = ["S101", "SLF001", "PLR2004", "INP001"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
yomiage = "yomiage:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
